name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: sunscrypt, POSTGRES_PASSWORD: sunscrypt, POSTGRES_DB: sunscrypt}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sunscrypt" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: {run: {working-directory: backend}}
    env:
      SUNS_DATABASE_URL: postgresql+asyncpg://sunscrypt:sunscrypt@localhost:5432/sunscrypt
      SUNS_REDIS_URL: redis://localhost:6379/0
      SUNS_REQUIRE_SERVICES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
