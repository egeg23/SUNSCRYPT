# SUNSCRYPT — шлюз внутри проекта Compose. Хостовый nginx (с сертификатом)
# шлёт всё на 127.0.0.1:WEB_PORT → сюда; здесь /api уходит в backend,
# остальное — сайту. Адреса контейнеров спрашиваем у DNS Docker при каждом
# запросе (resolver + переменные), чтобы перезапуск сервиса не ломал шлюз.
server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 5m;

    # Сайт нельзя встроить в чужую страницу (кликджекинг), типы файлов не
    # угадываются, адрес страницы наружу не уходит. HSTS браузер учитывает
    # только по HTTPS — его даёт хостовый nginx.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    set $backend http://backend:8000;
    set $web http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    location /api/ {
        # Реальное время (WebSocket/SSE) — без буфера и с долгим ожиданием.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_pass $backend;
    }

    location / {
        proxy_pass $web;
    }
}
